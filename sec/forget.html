<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="referrer" content="no-referrer">
  <script src="../core/config.js"></script>
  <script src="../core/guard.js"></script>
  <link rel="icon" type="image/png" href="../img/fav.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@600;700&display=swap">
  <link rel="stylesheet" href="sec.css">
  <title>Sirb Ai — استعادة كلمة المرور</title>
</head>
<body>
  <div class="bg"></div>
  <main class="card wide">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></div>
    <h1 id="title">استعادة كلمة المرور</h1>
    <ol class="steps" aria-label="الخطوات"><li class="on">البريد</li><li>التحقق</li><li>الرمز</li><li>كلمة جديدة</li></ol>
    <p id="lead">أدخل البريد الإلكتروني المسجّل في حسابك.</p>

    <form id="s1" novalidate>
      <label for="em">البريد الإلكتروني</label>
      <input id="em" type="email" placeholder="name@example.com" autocomplete="email" maxlength="254">
      <button type="submit">متابعة</button>
    </form>

    <form id="s2" novalidate hidden>
      <label for="qn">الاسم المسجّل في الحساب</label>
      <input id="qn" type="text" maxlength="60" class="rtl" autocomplete="off">
      <label for="qc">كم كان رصيدك من الكريديت تقريباً؟</label>
      <input id="qc" type="number" min="0" max="1000000" inputmode="numeric">
      <label for="qd">في أي شهر أنشأت الحساب؟</label>
      <input id="qd" type="month">
      <label for="ql">متى كان آخر استخدام للحساب؟</label>
      <input id="ql" type="date">
      <label for="qp">كلمة مرور قديمة تتذكرها (اختياري)</label>
      <input id="qp" type="password" maxlength="128" autocomplete="off">
      <small class="hint">أجب عن 3 أسئلة على الأقل إجابة صحيحة. الإجابة الخاطئة تُنهي المحاولة.</small>
      <button type="submit">تحقق</button>
    </form>

    <form id="s3" novalidate hidden>
      <label for="cd">رمز التحقق (6 أرقام)</label>
      <input id="cd" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
      <button type="submit">تأكيد الرمز</button>
    </form>

    <form id="s4" novalidate hidden>
      <label for="np">كلمة المرور الجديدة</label>
      <input id="np" type="password" autocomplete="new-password" maxlength="128" placeholder="8 أحرف على الأقل، تتضمن حروفاً وأرقاماً">
      <label for="np2">تأكيد كلمة المرور</label>
      <input id="np2" type="password" autocomplete="new-password" maxlength="128">
      <button type="submit">حفظ كلمة المرور</button>
    </form>

    <p id="msg" class="note" role="alert"></p>
    <a class="back" href="../log/one.html">رجوع لتسجيل الدخول</a>
    <div class="brand">SIRB AI · SMARTER TOGETHER</div>
  </main>
  <script src="../core/core.js"></script>
  <script src="forget.js"></script>
  <script src="../core/lang.js"></script>
</body>
</html>
