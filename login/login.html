<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | Sirb_Ai</title>
<link rel="icon" type="image/png" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../one.css">
<link rel="stylesheet" href="login.css">
<script src="../one.js"></script>
</head>
<body>
<main class="shell">
<section class="panel panel-form">
<div class="form-wrap">
<header class="brand">
<a class="logo" href="../index.html" aria-label="Sirb_Ai">
<span class="logo-mark"><img src="../img/logo.png" alt=""></span>
<span class="logo-text" dir="ltr"><b>Sirb<i>_Ai</i></b><small>SMARTER TOGETHER</small></span>
</a>
<button class="theme-btn" id="themeBtn" type="button" aria-label="تبديل الوضع">
<svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
<svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
</header>

<div class="tabs" id="tabs" data-active="login" role="tablist">
<span class="tabs-ind"></span>
<button class="tab is-active" type="button" role="tab" data-tab="login">تسجيل الدخول</button>
<button class="tab" type="button" role="tab" data-tab="signup">إنشاء حساب</button>
</div>

<div class="forms">
<form class="form is-active" id="loginForm" data-form="login" novalidate>
<div class="form-head">
<h1>أهلاً بعودتك</h1>
<p>سجّل دخولك لتكمل من حيث توقفت</p>
</div>
<div class="field" data-field="email">
<label for="lEmail">البريد الإلكتروني</label>
<div class="control">
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
<input id="lEmail" name="email" type="email" dir="auto" autocomplete="email" placeholder="name@example.com">
</div>
<small class="msg"></small>
</div>
<div class="field" data-field="password">
<label for="lPass">كلمة المرور</label>
<div class="control">
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
<input id="lPass" name="password" type="password" dir="auto" autocomplete="current-password" placeholder="••••••••">
<button class="eye" type="button" data-eye aria-label="إظهار كلمة المرور">
<svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
</button>
</div>
<small class="msg"></small>
</div>
<button class="btn btn-primary" type="submit">
<span>تسجيل الدخول</span>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
</button>
<p class="switch">ليس لديك حساب؟ <button type="button" data-go="signup">إنشاء حساب</button></p>
</form>

<form class="form" id="signupForm" data-form="signup" novalidate>
<div class="form-head">
<h1>ابدأ رحلتك معنا</h1>
<p>أنشئ حسابك في ثوانٍ وانضم إلى Sirb_Ai</p>
</div>
<div class="field" data-field="name">
<label for="sName">الاسم</label>
<div class="control">
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
<input id="sName" name="name" type="text" dir="auto" autocomplete="name" placeholder="اسمك الكامل">
</div>
<small class="msg"></small>
</div>
<div class="field" data-field="email">
<label for="sEmail">البريد الإلكتروني</label>
<div class="control">
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
<input id="sEmail" name="email" type="email" dir="auto" autocomplete="email" placeholder="name@example.com">
</div>
<small class="msg"></small>
</div>
<div class="field" data-field="password">
<label for="sPass">كلمة المرور</label>
<div class="control">
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
<input id="sPass" name="password" type="password" dir="auto" autocomplete="new-password" placeholder="ثمانية أحرف على الأقل">
<button class="eye" type="button" data-eye aria-label="إظهار كلمة المرور">
<svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
</button>
</div>
<small class="msg"></small>
</div>
<div class="field" data-field="terms">
<label class="check">
<input type="checkbox" name="terms">
<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
<span>أوافق على <a id="termsLink" href="#" target="_blank" rel="noopener">شروط الاستخدام وسياسة الخصوصية</a></span>
</label>
<small class="msg"></small>
</div>
<button class="btn btn-primary" type="submit">
<span>إنشاء حساب</span>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
</button>
<p class="switch">لديك حساب بالفعل؟ <button type="button" data-go="login">تسجيل الدخول</button></p>
</form>
</div>
</div>
</section>

<section class="panel panel-visual" aria-hidden="true">
<div class="grid-bg"></div>
<span class="orb orb-1"></span>
<span class="orb orb-2"></span>
<img class="watermark" src="../img/logo.png" alt="">
<div class="stage-wrap">
<div class="stage" id="stage"></div>
</div>
<div class="visual-foot">
<span class="tag">SMARTER TOGETHER</span>
<span class="pulse"></span>
</div>
</section>
</main>
<script src="login.js"></script>
</body>
</html>
