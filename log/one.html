<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Sirb Ai — أنشئ صورك بالذكاء الاصطناعي. SMARTER TOGETHER">
  <title>Sirb Ai — تسجيل الدخول</title>
  <link rel="icon" type="image/png" sizes="512x512" href="../img/fav.png">
  <link rel="apple-touch-icon" href="../img/fav.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../core/core.css">
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 4.6V7M12 17v2.4M4.6 12H7M17 12h2.4M6.6 6.6l1.5 1.5M15.9 15.9l1.5 1.5M6.6 17.4l1.5-1.5M15.9 8.1l1.5-1.5"/><circle cx="12" cy="3" r="1.4"/><circle cx="12" cy="21" r="1.4"/><circle cx="3" cy="12" r="1.4"/><circle cx="21" cy="12" r="1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.6 14.4A8 8 0 1 1 9.6 4.4a6.4 6.4 0 0 0 10 10z"/><path d="M14 4.6h3.6"/><circle cx="19.2" cy="4.6" r="1.4"/><path d="M17 9.4h1.6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8.5L18.5 21H14v-5h-4v5H5.5L4 19.5z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M10 3.5 11.6 8.4 16.5 10l-4.9 1.6L10 16.5l-1.6-4.9L3.5 10l4.9-1.6z"/><path d="m14.6 14.6 2.8 2.8"/><circle cx="18.6" cy="18.6" r="1.6"/><circle cx="18" cy="5" r="1.2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 19 5.5V11c0 4.6-3 8.2-7 10-4-1.8-7-5.4-7-10V5.5z"/><path d="M12 17v-4.6l2.6-2.6"/><circle cx="15.7" cy="8.7" r="1.4"/><path d="M9.4 12.8 12 15.2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="7.8" cy="7.8" r="3"/><circle cx="16.2" cy="7.8" r="3"/><path d="M2.5 20v-1.6L6 15h3.6l1.2 1.2M13.2 16.2l1.2-1.2H18l3.5 3.4V20"/><circle cx="12" cy="17.4" r="1.3"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><path d="M3 7.5 5.5 5h13L21 7.5v9L18.5 19h-13L3 16.5z"/><path d="m3.6 7.6 8.4 5.6 4-2.7"/><circle cx="17.6" cy="9.4" r="1.4"/><path d="m19 8.5 1.4-.9"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M5 11h14v8l-2 2H7l-2-2z"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.2" r="1.5"/><path d="M12 16.7v1.8"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12 7 6.5h10l4.5 5.5-4.5 5.5H7z"/><circle cx="12" cy="12" r="2.6"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.5 6.5H17l4.5 5.5-2.2 2.7M16.5 17.5H7L2.5 12l2.4-2.9"/><path d="M10.2 10.2a2.6 2.6 0 0 0 3.6 3.6"/><path d="M5 19 19 5"/><circle cx="3.9" cy="20.1" r="1.4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7.8" r="3.5"/><path d="M4.5 20.5V18l3-3h9l3 3v2.5"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><path d="M3.5 8h17v3.5h-17z"/><path d="M5 11.5V19l1.5 1.5h11L19 19v-7.5M12 8v12.5"/><circle cx="8.6" cy="5" r="1.8"/><circle cx="15.4" cy="5" r="1.8"/><path d="M10 6.3 12 8l2-1.7"/></symbol>
  </svg>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="تبديل الوضع">
    <svg class="ic sun"><use href="#i-sun"/></svg><svg class="ic moon"><use href="#i-moon"/></svg>
  </button>
  <a href="../index.html" class="back-home"><svg class="ic"><use href="#i-home"/></svg>الرئيسية</a>

  <main class="layout">
    <section class="hero">
      <a class="brand" href="../index.html">
        <img src="../img/logo.png" alt="Sirb Ai" class="brand-logo">
        <div>
          <h1 class="brand-name en">SIRB <span>Ai</span></h1>
          <p class="brand-tag en">SMARTER TOGETHER</p>
        </div>
      </a>
      <div class="phrase-box" aria-live="polite"><p id="phrase" class="phrase"></p></div>
      <ul class="perks">
        <li><svg class="ic"><use href="#i-spark"/></svg>حوّل كلماتك إلى صور مذهلة في ثوانٍ</li>
        <li><svg class="ic"><use href="#i-shield"/></svg>حسابك محمي بتشفير قوي وتحقق من البريد</li>
        <li><svg class="ic"><use href="#i-users"/></svg>ادعُ أصدقاءك بكود دعوة خاص بك</li>
      </ul>
    </section>

    <section class="card" aria-label="الحساب">
      <div class="logo-ring"><img src="../img/logo.png" alt=""></div>

      <h2 class="card-title">أهلاً بك في <span class="en">Sirb Ai</span></h2>
      <p class="card-sub">سجّل دخولك أو أنشئ حساباً جديداً</p>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" role="tab" data-tab="login" aria-selected="true">تسجيل الدخول</button>
        <button type="button" class="tab" role="tab" data-tab="signup" aria-selected="false">إنشاء حساب</button>
        <span class="tab-indicator" id="tabIndicator"></span>
      </div>

      <form id="loginForm" class="form active" novalidate autocomplete="on">
        <label class="field">
          <span>البريد الإلكتروني</span>
          <div class="input-wrap"><svg class="ic"><use href="#i-mail"/></svg><input type="email" name="email" maxlength="254" autocomplete="email" dir="ltr" required></div>
          <small class="err"></small>
        </label>
        <label class="field">
          <span>كلمة المرور</span>
          <div class="input-wrap pass-wrap"><svg class="ic"><use href="#i-lock"/></svg>
            <input type="password" name="password" maxlength="128" autocomplete="current-password" dir="ltr" required>
            <button type="button" class="eye" aria-label="إظهار كلمة المرور"><svg class="ic open"><use href="#i-eye"/></svg><svg class="ic off"><use href="#i-eye-off"/></svg></button>
          </div>
          <small class="err"></small>
        </label>
        <button type="submit" class="btn">دخول</button>
        <p class="msg" role="alert"></p>
      </form>

      <form id="signupForm" class="form" novalidate autocomplete="on">
        <label class="field">
          <span>الاسم</span>
          <div class="input-wrap"><svg class="ic"><use href="#i-user"/></svg><input type="text" name="name" maxlength="50" autocomplete="name" required></div>
          <small class="err"></small>
        </label>
        <label class="field">
          <span>البريد الإلكتروني</span>
          <div class="input-wrap"><svg class="ic"><use href="#i-mail"/></svg><input type="email" name="email" maxlength="254" autocomplete="email" dir="ltr" required></div>
          <small class="hint">Gmail, Outlook, Hotmail, Yahoo, iCloud, Proton ...</small>
          <small class="err"></small>
        </label>
        <label class="field">
          <span>كود التحقق</span>
          <div class="code-wrap">
            <input type="text" name="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" dir="ltr" class="en code-input" placeholder="••••••" required>
            <button type="button" class="send-code" id="sendCode">إرسال الكود</button>
          </div>
          <small class="err"></small>
        </label>
        <label class="field">
          <span>كلمة المرور</span>
          <div class="input-wrap pass-wrap"><svg class="ic"><use href="#i-lock"/></svg>
            <input type="password" name="password" maxlength="128" autocomplete="new-password" dir="ltr" required>
            <button type="button" class="eye" aria-label="إظهار كلمة المرور"><svg class="ic open"><use href="#i-eye"/></svg><svg class="ic off"><use href="#i-eye-off"/></svg></button>
          </div>
          <div class="meter"><i id="meterBar"></i></div>
          <small class="err"></small>
        </label>
        <label class="field">
          <span>كود الدعوة <em>(اختياري)</em></span>
          <div class="input-wrap"><svg class="ic"><use href="#i-gift"/></svg><input type="text" name="invite" maxlength="8" autocomplete="off" dir="ltr" class="en upper"></div>
          <small class="err"></small>
        </label>
        <label class="agree">
          <input type="checkbox" name="terms" required>
          <span>أوافق على <a href="../terms/index.html?from=one" class="link">شروط الاستخدام وسياسة الخصوصية</a></span>
        </label>
        <small class="err agree-err"></small>
        <button type="submit" class="btn">إنشاء الحساب</button>
        <p class="msg" role="alert"></p>
      </form>
      <p class="legal"><a href="../terms/index.html?from=one" class="link">شروط الاستخدام والخصوصية</a></p>
    </section>
  </main>

  <script src="../core/config.js"></script>
  <script src="../core/core.js"></script>
  <script src="one.js"></script>
</body>
</html>
